[project]
name = "synapse-deep-research"
version = "0.4.0"
description = "AI-powered deep research CLI using Z.AI GLM and OpenCode Go models"
requires-python = ">=3.9"
dependencies = [
    "openai>=1.0.0",
    "anthropic>=0.40.0",
    "tavily-python>=0.5.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "tenacity>=8.2.0",
    "pymupdf>=1.24.0",
    "ddgs>=9.0.0",
    "prompt-toolkit>=3.0.0",
    "keyring>=24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
synapse-deep-research = "synapse_deep_research.entry:run"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# The skill that `synapse-deep-research skills install` copies into other agents.
[tool.setuptools.package-data]
synapse_deep_research = ["skill/*.md"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
