[project]
name = "deep-research"
version = "0.1.0"
description = "AI-powered deep research framework using Z.AI GLM models"
requires-python = ">=3.9"
dependencies = [
    "openai>=1.0.0",
    "tavily-python>=0.5.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "tenacity>=8.2.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "websockets>=12.0",
    "markdown>=3.5",
    "weasyprint>=60.0",
    "pymupdf>=1.24.0",
    "ddgs>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
deep-research = "deep_research.main:main"
deep-research-server = "deep_research.server:run"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
